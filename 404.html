<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Лоза</title>
  </head>
  <body>
    <script>
      (function () {
        var path = location.pathname || '';
        var media = path.match(/\/m\/([^/]+)/);
        var post = path.match(/\/p\/([^/]+)/);
        if (media) location.replace('/?media=' + encodeURIComponent(decodeURIComponent(media[1])));
        else if (post) location.replace('/?post=' + encodeURIComponent(decodeURIComponent(post[1])));
        else location.replace('/');
      })();
    </script>
  </body>
</html>
