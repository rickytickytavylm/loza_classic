    <link rel="stylesheet" href="css/onboarding.css?v=44" />
    <title>Лоза — психологический клуб</title>
    <script>
      (function () {
        var shortSide = Math.min(screen.width || 0, screen.height || 0);
        var touch = navigator.maxTouchPoints > 1 || /iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent);
        if ((touch && shortSide && shortSide <= 767) || (window.innerWidth && window.innerWidth <= 980)) {
          document.documentElement.classList.add('is-compact');
        }
      })();
    </script>
    <script src="config.js?v=44"></script>
  </head>
  <body>
    <div id="app" class="app">
      <div id="splash" class="splash-screen" aria-hidden="true" style="position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#f6f3fa">
        <div class="splash-brand">
          <img class="splash-logo" src="assets/webp/new_logo.webp" alt="" />
          <span>Лоза</span>
        </div>
      </div>

      <div id="onboarding" class="onboarding" hidden aria-label="Онбординг">
        <div class="onboarding-top">
          <div class="onboarding-dots" id="onboarding-dots" aria-hidden="true"></div>
          <button type="button" class="onboarding-next" id="onboarding-next">Далее</button>
        </div>
        <div class="onboarding-slides" id="onboarding-slides"></div>
      </div>

      <div id="auth-screen" class="auth-screen" hidden aria-label="Вход">
        <picture class="auth-screen-bg-picture">
          <source media="(min-width: 981px)" srcset="assets/webp/auth_back_desktop.webp" type="image/webp" />
          <img class="auth-screen-bg" src="assets/webp/auth_back.webp" alt="" decoding="async" />
        </picture>
        <div class="auth-screen-veil" aria-hidden="true"></div>
        <div class="auth-screen-body">
          <div class="auth-screen-brand">
            <img src="assets/webp/new_logo.webp" alt="" />
            <strong>Лоза</strong>
          </div>
          <p class="auth-screen-lead">Войдите, чтобы сохранить прогресс и открыть клуб</p>
          <label class="auth-consent">
            <input type="checkbox" id="auth-consent-terms" />
            <span>Принимаю <a href="./terms.html" target="_blank" rel="noopener">условия использования</a> и даю согласие на обработку персональных данных</span>
          </label>
          <label class="auth-consent">
            <input type="checkbox" id="auth-consent-privacy" />
            <span>Ознакомлен(а) с <a href="./privacy.html" target="_blank" rel="noopener">политикой конфиденциальности</a></span>
          </label>
          <button type="button" class="auth-yandex-btn" id="auth-yandex-btn" disabled>
            <span class="auth-yandex-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22">
                <rect width="24" height="24" rx="6" fill="#FC3F1D" />
                <path d="M13.32 6.2h-1.7c-1.62 0-2.54.86-2.54 2.34 0 1.2.58 1.86 1.78 2.62l.98.62-2.84 4.22H7.1l2.5-3.72c-1.46-1.02-2.28-2.1-2.28-3.84 0-2.34 1.62-3.84 4.42-3.84h3.58V18.2h-1.98V6.2Z" fill="#fff" />
              </svg>
            </span>
            <span>Войти через Яндекс</span>
          </button>
          <p class="auth-screen-error" id="auth-screen-error" hidden></p>
        </div>
      </div>

      <header class="topbar">
        <button class="brand" type="button" data-tab="home">
          <img src="assets/webp/new_logo.webp" alt="Лоза" />
          <span>Лоза</span>
        </button>
        <nav class="desktop-nav" aria-label="Основная навигация" id="desktop-nav"></nav>
        <div class="header-actions">
          <button aria-label="Профиль" class="profile-pill ios-profile" type="button" data-tab="profile">
            <span class="profile-pill-inner" id="header-initial">В</span>
          </button>
        </div>
      </header>

      <main class="shell">
        <section class="page-shell" id="page-shell" aria-live="polite"></section>
      </main>

      <nav class="mobile-nav" aria-label="Мобильная навигация" id="mobile-nav"></nav>
    </div>

    <div id="portal" aria-hidden="true"></div>

    <script src="js/data.js?v=44" defer></script>
    <script src="js/libraryContent.js?v=44" defer></script>
    <script src="js/audioStorage.js?v=44" defer></script>
    <script src="js/media.js?v=44" defer></script>
    <script src="js/api.js?v=44" defer></script>
    <script src="js/app.js?v=44" defer></script>
  </body>
</html>
